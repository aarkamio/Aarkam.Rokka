name: Publish Rokka Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image Version Tag (e.g. 1.0.2)'
        required: true
        default: '1.0.2'
      release_tag:
        description: 'GitHub Release Tag to fetch binary from (e.g. rokka-v1.0.2)'
        required: false
        default: 'rokka-v1.0.2'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'rokka') ||
      contains(github.event.release.name, 'Rokka')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Version and Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_TAG="${{ github.event.release.tag_name }}"
          else
            RAW_TAG="${{ github.event.inputs.release_tag }}"
            if [ -z "$RAW_TAG" ]; then
              RAW_TAG="rokka-v${{ github.event.inputs.version }}"
            fi
          fi
          
          # Clean version: strip "rokka-v", "rokka-", "v-", "v"
          CLEAN_VER="${RAW_TAG#rokka-v}"
          CLEAN_VER="${CLEAN_VER#rokka-}"
          CLEAN_VER="${CLEAN_VER#v-}"
          CLEAN_VER="${CLEAN_VER#v}"
          CLEAN_VER="${CLEAN_VER#-}"
          if [ -z "${CLEAN_VER}" ]; then
            CLEAN_VER="${{ github.event.inputs.version || '1.0.2' }}"
          fi
          
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "release_tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "Resolved Version: ${CLEAN_VER}, Release Tag: ${RAW_TAG}"

      - name: Stage Release Payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_TAG: ${{ steps.meta.outputs.release_tag }}
          CLEAN_VER: ${{ steps.meta.outputs.version }}
        run: |
          mkdir -p dist/linux /tmp/release-asset
          
          if [ -f "dist/linux/rokka-coordinator" ] && [ -f "dist/linux/rokka-gateway" ]; then
            echo "Found pre-existing Linux binaries in dist/linux."
          elif [ -f "dist/staging/linux-x64/rokka-coordinator" ] && [ -f "dist/staging/linux-x64/rokka-gateway" ]; then
            echo "Staging from dist/staging/linux-x64 to dist/linux..."
            cp -r dist/staging/linux-x64/* dist/linux/
          else
            echo "Fetching Rokka release payload for Tag: ${RAW_TAG}, Version: ${CLEAN_VER}..."
            FOUND=false
            CANDIDATE_TAGS=(
              "${RAW_TAG}"
              "rokka-v${CLEAN_VER}"
              "rokka-${CLEAN_VER}"
              "v${CLEAN_VER}"
              "v-${CLEAN_VER}"
              "${CLEAN_VER}"
            )

            # Strategy 1: gh release download
            for t in "${CANDIDATE_TAGS[@]}"; do
              echo "Attempting gh release download for tag: $t..."
              if gh release download "$t" --repo "aarkamio/Aarkam.Rokka" --pattern "*rokka*linux*.zip" --dir /tmp/release-asset; then
                FOUND=true
                echo "Downloaded via gh release from aarkamio/Aarkam.Rokka with tag $t"
                break
              elif gh release download "$t" --repo "${{ github.repository }}" --pattern "*rokka*linux*.zip" --dir /tmp/release-asset; then
                FOUND=true
                echo "Downloaded via gh release from ${{ github.repository }} with tag $t"
                break
              elif gh release download "$t" --repo "aarkamio/Aarkam" --pattern "*rokka*linux*.zip" --dir /tmp/release-asset; then
                FOUND=true
                echo "Downloaded via gh release from aarkamio/Aarkam with tag $t"
                break
              elif gh release download "$t" --repo "${{ github.repository }}" --pattern "*linux*.zip" --dir /tmp/release-asset; then
                FOUND=true
                echo "Downloaded generic linux zip via gh release from ${{ github.repository }} with tag $t"
                break
              fi
            done

            # Strategy 2: Direct curl from GitHub Releases
            if [ "$FOUND" = false ]; then
              echo "gh release not matched; attempting direct curl download from GitHub Releases..."
              CANDIDATE_URLS=(
                "https://github.com/aarkamio/Aarkam.Rokka/releases/download/${RAW_TAG}/rokka-v${CLEAN_VER}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam.Rokka/releases/download/rokka-v${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam.Rokka/releases/download/${RAW_TAG}/rokka-${RAW_TAG}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam/releases/download/${RAW_TAG}/rokka-v${CLEAN_VER}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam/releases/download/rokka-v${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam/releases/download/${RAW_TAG}/rokka-${RAW_TAG}-linux-x64.zip"
                "https://github.com/aarkamio/Aarkam/releases/download/v${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip"
              )
              for url in "${CANDIDATE_URLS[@]}"; do
                echo "Probing URL: $url"
                if curl -sSL -f ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} -o /tmp/release-asset/rokka-linux-x64.zip "$url"; then
                  FOUND=true
                  echo "Successfully downloaded via curl: $url"
                  break
                fi
              done
            fi

            # Strategy 3: Local repository fallback
            if [ "$FOUND" = false ]; then
              if [ -f "V-${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip" ]; then
                echo "Using local release archive: V-${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip"
                cp "V-${CLEAN_VER}/rokka-v${CLEAN_VER}-linux-x64.zip" /tmp/release-asset/
                FOUND=true
              elif [ -f "V-${CLEAN_VER}/linux/rokka-coordinator" ]; then
                echo "Using pre-extracted binaries from V-${CLEAN_VER}/linux/"
                cp -r V-${CLEAN_VER}/linux/* dist/linux/
                FOUND=true
              fi
            fi

            # Extract ALL downloaded zip archives into dist/linux/
            echo "Extracting all staged zip archives from /tmp/release-asset/ into dist/linux/..."
            for z in $(find /tmp/release-asset -name "*linux*.zip" 2>/dev/null); do
              echo "--> Inflating $z into dist/linux/..."
              unzip -o "$z" -d dist/linux/
            done
          fi
          
          # Stage entrypoint script
          if [ -f "entrypoint.sh" ] && [ ! -f "dist/linux/entrypoint.sh" ]; then
            cp entrypoint.sh dist/linux/
          elif [ -f "V-${CLEAN_VER}/linux/entrypoint.sh" ] && [ ! -f "dist/linux/entrypoint.sh" ]; then
            cp "V-${CLEAN_VER}/linux/entrypoint.sh" dist/linux/
          elif [ -f "V-1.0.2/linux/entrypoint.sh" ] && [ ! -f "dist/linux/entrypoint.sh" ]; then
            cp "V-1.0.2/linux/entrypoint.sh" dist/linux/
          fi
          
          # Verify staged binaries
          if [ ! -f "dist/linux/rokka-coordinator" ] || [ ! -f "dist/linux/rokka-gateway" ]; then
            echo "FATAL: Required Rokka binaries (rokka-coordinator, rokka-gateway) not found in dist/linux/!"
            echo "Contents of dist/linux:"
            ls -la dist/linux/ || true
            exit 1
          fi

          chmod +x dist/linux/rokka-coordinator dist/linux/rokka-gateway dist/linux/entrypoint.sh dist/linux/install-rokka.sh 2>/dev/null || true
          echo "Payload staged successfully:"
          ls -la dist/linux/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:v${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:${{ steps.meta.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/aarkam.rokka:latest

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: aarkam/aarkam.rokka
          readme-filepath: V-1.0.2/DOCKER_README.md
